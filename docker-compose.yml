version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: infoscript-mongodb-dev
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: infoscript
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data_dev:/data/db
    networks:
      - infoscript-network-dev

volumes:
  mongodb_data_dev:
    driver: local

networks:
  infoscript-network-dev:
    driver: bridge


